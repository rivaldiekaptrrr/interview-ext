name: Release Chrome Extension Bundle

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile & Build Extension
        run: npm run build

      - name: Extract Project Version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_VER="${GITHUB_REF#refs/tags/}"
          else
            PKG_VER=$(node -p "require('./package.json').version")
            TAG_VER="v${PKG_VER}"
          fi
          echo "version=${TAG_VER}" >> $GITHUB_OUTPUT
          echo "Building release for: ${TAG_VER}"

      - name: Archive Distribution Artifacts (ZIP)
        run: |
          cd dist
          zip -r ../ai-interview-assistant-${{ steps.get_version.outputs.version }}.zip .
          cd ..

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: "Release ${{ steps.get_version.outputs.version }}"
          files: |
            ai-interview-assistant-${{ steps.get_version.outputs.version }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifact to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: ai-interview-assistant-${{ steps.get_version.outputs.version }}
          path: dist/
