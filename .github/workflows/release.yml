name: Release Chrome Extension Bundle

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile & Build Extension
        run: npm run build

      - name: Archive Distribution Artifact (ZIP)
        run: |
          cd dist
          zip -r ../ai-interview-copilot-${{ github.ref_name }}.zip .
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Release ${{ github.ref_name }}"
          files: ai-interview-copilot-${{ github.ref_name }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Upload Artifact (for manual dispatch without tag)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: ai-interview-copilot-dev-bundle
          path: dist/
